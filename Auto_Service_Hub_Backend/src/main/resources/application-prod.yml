# =============================================================================
# PRODUCTION profile — Auto_Service_Hub AI CRM backend (SRS 19, 20)
# =============================================================================
# Secrets are NOT defaulted here. SRS 19 requires database passwords, JWT secrets
# and provider credentials to come from environment/secret management rather than
# source code, so every value below is ${ENV_VAR} with no fallback. A missing
# variable therefore fails startup loudly instead of silently running with a
# well-known secret.
#
# Local development is unaffected: it uses application.yml, which keeps
# developer-friendly defaults.
# =============================================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    # No defaults. DB_URL / DB_USERNAME / DB_PASSWORD must be supplied.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # SRS 20 places HTTPS termination at the reverse proxy, not in Spring Boot.
  # Trusting forwarded headers is what makes the app aware it is being served
  # over HTTPS, so redirects and any absolute URLs are generated with https://
  # instead of http://.
  forward-headers-strategy: framework

app:
  bootstrap-admin:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:}
  jwt:
    # No default. The development placeholder must not be reachable in prod —
    # a known signing key would let anyone forge an OWNER token.
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000

  govid:
    # No default. Government / Aadhaar IDs are encrypted with AES-GCM and the
    # key must come from the environment. A missing variable therefore blocks
    # Government ID submission loudly instead of silently storing nothing.
    encryption-key: ${MECHANIC_GOVID_ENCRYPTION_KEY}

  cors:
    # No default: the deployed frontend origins must be stated explicitly, so
    # production cannot silently fall back to allowing localhost.
    allowed-origins: ${CORS_ORIGINS}

  ai:
    provider: ${AI_PROVIDER:none}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}

logging:
  level:
    com.autoservicehub: INFO
